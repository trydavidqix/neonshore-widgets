<div id="card" class="glass"><div class="kicker" id="kick"></div>
 <div class="chrome" id="head"><span class="ex"></span><span class="fc"></span><span class="gl"></span></div>
 <div class="neon-script pink" id="msg"></div></div>
<div id="strip"></div></div></div>
<script src="engine.js"></script><script src="config.js"></script><script>
const CFG = Object.assign({}, window.SJCFG || {}); for (const [k, v] of new URLSearchParams(location.search)) CFG[k] = v;
const hex = h => "#" + String(h || "").replace(/^#/, "");
</script><script>
const TYPES = { follow: {acc: "3fe0d0", neon: "", }, sub: {acc: "ff4fa3", neon: "pink"}, tip: {acc: "ffd36b", neon: "gold"}, raid: {acc: "22e4ff", neon: ""} };
const NO_NAME = { follow: "welcome to the shore", sub: "joined the crew", tip: "straight into the bag", raid: "the crew rolls in" };
const wrap = document.getElementById("wrap"), al = document.getElementById("al"), card = document.getElementById("card"), emb = document.getElementById("emb");
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); wrap.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`; }
fit(); addEventListener("resize", fit);
if (CFG.hostsStrip) document.getElementById("strip").innerHTML = `<span><span class="ai-badge"><b>AI</b>VIRTUAL</span>${CFG.hostsStrip}</span>`;
function fill(s, a) { return String(s).replace("{name}", a.name || "").replace("{amount}", a.amount || "").replace("{count}", a.count || ""); }
function setAlert(a) {
  const ty = TYPES[a.type] || TYPES.follow; document.documentElement.style.setProperty("--acc", hex(ty.acc));
  const label = CFG[a.type + "Label"] || "", msg = a.name ? fill(CFG[a.type + "Msg"] || "", a) : NO_NAME[a.type];
  document.getElementById("kick").textContent = a.name ? label : "INCOMING";
  const head = a.name ? a.name : label; document.querySelectorAll("#head span").forEach(s => s.textContent = head);
  const m = document.getElementById("msg"); m.textContent = msg; m.className = "neon-script " + ty.neon;
  const h = document.getElementById("head"); h.style.fontSize = "96px"; const max = 900; if (h.scrollWidth > max) h.style.fontSize = (96 * max / h.scrollWidth) + "px";
}
const D = +CFG.alertSeconds || 6; SJ.T = D;
const gl = [...document.querySelectorAll(".gl")], sp = [...document.querySelectorAll(".sp")];
function frame(t) { // t = seconds since the alert started
  const E = SJ.ease, sg = SJ.seg, out = sg(t, D - 1.0, D - 0.4);
  al.style.opacity = t < 0 || t > D ? 0 : 1;
  const es = E.back(sg(t, 0, .55)) * (1 - E.inout(out));
  emb.style.transform = `scale(${Math.max(0, es)}) rotate(${(1 - sg(t, 0, .55)) * -90}deg)`;
  document.getElementById("burst").style.opacity = sg(t, .1, .6) * (1 - out); document.getElementById("burst").style.transform = `rotate(${t * 12}deg) scale(${.6 + .4 * E.out(sg(t, .1, .8))})`;
  const ci = E.out(sg(t, .35, .85)); card.style.opacity = ci * (1 - out);
  card.style.transform = `translateY(${(1 - ci) * 60 - out * 40}px) skewX(${-8 + (1 - ci) * -10}deg)`;
  [...card.children].forEach(c => c.style.transform = `skewX(${8 + (1 - ci) * 10}deg)`);
  gl.forEach(g => g.style.setProperty("--gp", (200 - sg(t, .9, 1.9) * 250) + "%"));
  const d = t - 1.0, m = document.getElementById("msg"); const pat = [[0, 0], [.06, 1], [.1, .15], [.16, 1], [.22, .3], [.26, 1]]; let v = 0; for (const [a, b] of pat) if (d >= a) v = b; m.style.opacity = v;
  document.getElementById("strip").style.opacity = sg(t, 1.2, 1.6) * (1 - out);
  sp.forEach((s, i) => { const p = sg(t, .2 + i * .05, 1.2 + i * .05); s.style.opacity = (Math.sin(p * Math.PI)) * (1 - out) * (t < D ? 1 : 0); s.style.transform = `rotate(45deg) translateY(${-p * 40}px) scale(${.5 + p})`; });
}
// render mode: ?render=1&type=follow&name=  -> SJ.setT drives one alert deterministically
const first = { type: CFG.type || "follow", name: CFG.name_alert ?? CFG.user ?? "", amount: CFG.amount || "$5", count: CFG.count || "42" };
SJ.on(frame);
// live queue
const Q = []; let busy = false;
window.SunsetJobAlert = function (a) { Q.push(a); if (!busy) next(); };
function next() { const a = Q.shift(); if (!a) { busy = false; return; } busy = true; setAlert(a); const t0 = performance.now();
  const f = () => { const t = (performance.now() - t0) / 1000; frame(t); if (t < D) requestAnimationFrame(f); else { frame(D + 1); setTimeout(next, 400); } }; requestAnimationFrame(f); }
setAlert(first);
if (SJ.render) SJ.setT(+(CFG.t || 0)); else { frame(-1);
  if (CFG.test) CFG.test.split(",").forEach(ty => SunsetJobAlert({ type: ty, name: CFG.user || "sunsetrider", amount: CFG.amount || "$5", count: CFG.count || "42" }));
  window.addEventListener("message", e => { if (e.data && e.data.sunsetJobAlert) SunsetJobAlert(e.data.sunsetJobAlert); });
  if (CFG.channel) twitchEvents(CFG.channel.toLowerCase()); }
// Twitch: anonymous read-only IRC gives subs, gift subs, raids and cheers (bits). Follows and tips need your alert service.
function twitchEvents(ch) {
  const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen = () => { ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands"); ws.send("PASS SCHMOOPIIE"); ws.send("NICK justinfan" + Math.floor(Math.random() * 80000 + 1000)); ws.send("JOIN #" + ch); };
  ws.onmessage = ev => ev.data.split("\r\n").forEach(line => {
    if (line.startsWith("PING")) return ws.send("PONG :tmi.twitch.tv");
    const tags = {}; if (line[0] === "@") line.slice(1, line.indexOf(" ")).split(";").forEach(kv => { const i = kv.indexOf("="); tags[kv.slice(0, i)] = kv.slice(i + 1); });
    const who = tags["display-name"] || tags["login"] || "";
    if (line.includes(" USERNOTICE ")) { const id = tags["msg-id"];
      if (["sub", "resub", "subgift", "submysterygift"].includes(id)) SunsetJobAlert({ type: "sub", name: who });
      if (id === "raid") SunsetJobAlert({ type: "raid", name: tags["msg-param-displayName"] || who, count: tags["msg-param-viewerCount"] }); }
    else if (line.includes(" PRIVMSG ") && tags.bits) SunsetJobAlert({ type: "tip", name: who, amount: tags.bits + " bits" });
  });
  ws.onclose = () => setTimeout(() => twitchEvents(ch), 5000);
}
